name: Build VIC-20 ROMs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      all_variants:
        description: Build all eight combinations (overrides choices below)
        type: boolean
        default: false
      fixes:
        description: Include BASIC and KERNAL bug fixes
        type: boolean
        default: true
      rainbow:
        description: Include the left-hand stepped rainbow and aligned layout
        type: boolean
        default: true
      banner:
        description: Use the V2.26 heading instead of the original heading
        type: boolean
        default: true
      universal_experimental:
        description: Also build Experiment 3 PAL/NTSC pairs with rainbow and stock screens
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install assembler and test emulator
        run: |
          sudo apt-get update
          sudo apt-get install --yes cc65
          python -m pip install -r requirements-test.txt
      - name: Build requested ROM combinations
        env:
          EVENT: ${{ github.event_name }}
          ALL_VARIANTS: ${{ inputs.all_variants }}
          FIXES: ${{ inputs.fixes }}
          RAINBOW: ${{ inputs.rainbow }}
          BANNER: ${{ inputs.banner }}
        run: |
          if [ "$EVENT" != "workflow_dispatch" ] || [ "$ALL_VARIANTS" = "true" ]; then
            node scripts/build-variants.mjs --all
          else
            node scripts/build-variants.mjs "--fixes=$FIXES" "--rainbow=$RAINBOW" "--banner=$BANNER"
          fi
      - name: Verify canonical ROM and every combination
        run: python tests/test_variants.py
      - name: Build and test experimental universal ROMs
        if: github.event_name != 'workflow_dispatch' || inputs.universal_experimental
        run: |
          node scripts/build-universal.mjs
          python tests/test_universal.py
          VIC20_EXPERIMENTAL=1 python tests/test_basic.py
          VIC20_EXPERIMENTAL=1 python tests/test_vic20.py
          node scripts/build-universal.mjs --screen=stock
          VIC20_UNIVERSAL_SCREEN=stock python tests/test_universal.py
          VIC20_UNIVERSAL_SCREEN=stock VIC20_EXPERIMENTAL=1 python tests/test_basic.py
      - name: Upload stock-screen Experiment 3 pair separately
        if: github.event_name != 'workflow_dispatch' || inputs.universal_experimental
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vic20-universal-8k-stock-screen-${{ github.run_number }}
          path: |
            build/universal-stock/*.bin
            build/universal-stock/*.s
            build/universal-stock/*.labels
            build/universal-stock/*.json
            build/universal-stock/*.md
            build/universal-stock/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
      - name: Upload experimental universal pair separately
        if: github.event_name != 'workflow_dispatch' || inputs.universal_experimental
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vic20-universal-8k-experimental-${{ github.run_number }}
          path: |
            build/universal/*.bin
            build/universal/*.s
            build/universal/*.labels
            build/universal/*.json
            build/universal/*.md
            build/universal/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
      - name: Upload ROM images, manifests and checksums
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vic20-pal-roms-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: Upload verification reports
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vic20-verification-${{ github.run_number }}
          path: verification/
          if-no-files-found: error
          retention-days: 90
